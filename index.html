<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaHooter</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; padding: 2rem; }
        h1 { color: #a855f7; text-shadow: 0 0 10px #46178f; margin: 0 0 1rem; }
        button { background: #46178f; color: #fff; border: none; padding: .6rem 1.2rem; font-size: 1rem; border-radius: 6px; cursor: pointer; margin-right: .5rem; }
        button:disabled { opacity: .4; cursor: not-allowed; }
        .controls { margin: 1rem 0; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
        input[type=number] { width: 100px; padding: .3rem; background: #16213e; color: #eee; border: 1px solid #46178f; border-radius: 4px; }
        #status { margin: 1rem 0; font-family: monospace; color: #a855f7; font-size: .9rem; }
        #bar { width: 100%; height: 14px; background: #16213e; border-radius: 7px; overflow: hidden; margin: .5rem 0 1rem; }
        #barFill { height: 100%; width: 0%; background: linear-gradient(90deg, #46178f, #a855f7); transition: width .2s; }
        #hits { list-style: none; padding: 0; max-height: 55vh; overflow-y: auto; }
        #hits li { background: #16213e; padding: .5rem 1rem; margin: .3rem 0; border-left: 4px solid #46e043; border-radius: 4px; font-family: monospace; animation: fadeIn .3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
        a { color: #a855f7; }
        .hit-count { color: #46e043; font-size: 1.4rem; font-weight: bold; }
    </style>
</head>
<body>
    <h1>KaHooter</h1>
    <div class="controls">
        <label>Start: <input type="number" id="start" value="0" min="0"></label>
        <label>End: <input type="number" id="end" value="1000000" min="1"></label>
        <label>Concurrency: <input type="number" id="conc" value="150" min="1" max="300"></label>
        <button id="scanBtn" onclick="scan()">Scan</button>
        <button id="stopBtn" onclick="stopScan()" disabled>Stop</button>
    </div>
    <div id="bar"><div id="barFill"></div></div>
    <div id="status">idle</div>
    <h3>Active sessions: <span class="hit-count" id="hitCount">0</span></h3>
    <ul id="hits"></ul>

    <script>
        const PROXY = 'http://localhost:3000'; // swap for your Render URL

        let source = null;

        function addHit(data) {
            const li = document.createElement('li');
            const tags = [
                data.twoFactorAuth ? '[2FA]' : '',
                data.namerator ? '[namer]' : '',
                data.smartPractice ? '[practice]' : ''
            ].filter(Boolean).join(' ');
            li.innerHTML = `<strong>${data.pin}</strong> ${tags} — <a href="https://kahoot.it/?pin=${data.pin}" target="_blank">join</a>`;
            document.getElementById('hits').prepend(li);
        }

        function scan() {
            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const conc = document.getElementById('conc').value;

            document.getElementById('hits').innerHTML = '';
            document.getElementById('hitCount').textContent = '0';
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;

            const url = `${PROXY}/scan?start=${start}&end=${end}&conc=${conc}`;
            source = new EventSource(url);

            source.addEventListener('hit', (e) => {
                const data = JSON.parse(e.data);
                addHit(data);
                const count = document.getElementById('hits').children.length;
                document.getElementById('hitCount').textContent = count;
            });

            source.addEventListener('progress', (e) => {
                const { checked, total, hits } = JSON.parse(e.data);
                const pct = (checked / total * 100);
                document.getElementById('barFill').style.width = pct.toFixed(2) + '%';
                document.getElementById('status').textContent =
                    `${checked.toLocaleString()} / ${total.toLocaleString()} (${pct.toFixed(2)}%) — ${hits} hits`;
            });

            source.addEventListener('done', (e) => {
                const { checked, hits } = JSON.parse(e.data);
                document.getElementById('status').textContent =
                    `done — ${checked.toLocaleString()} checked, ${hits} hits`;
                document.getElementById('barFill').style.width = '100%';
                cleanup();
            });

            source.onerror = () => {
                document.getElementById('status').textContent += ' — connection lost';
                cleanup();
            };
        }

        function stopScan() {
            if (source) { source.close(); source = null; }
            document.getElementById('status').textContent += ' — stopped';
            cleanup();
        }

        function cleanup() {
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            if (source) { source.close(); source = null; }
        }
    </script>
</body>
</html>
