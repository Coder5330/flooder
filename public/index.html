<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaHooter</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #121020; color: #fff; padding: 20px; }
        h1, h2 { color: #a855f7; margin-bottom: 10px; }
        .card { background: #1a162d; border: 1px solid #2d264f; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        input, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #2d264f; background: #0f0c1b; color: #fff; }
        button { background: #7c3aed; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #6d28d9; }
        #log { background: #080612; padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        
        /* Session List Layout */
        #hits-container { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 250px; overflow-y: auto; }
        .session-item { display: flex; justify-content: space-between; align-items: center; background: #0f0c1b; border: 1px solid #2d264f; padding: 8px 12px; border-radius: 6px; }
        .session-item span { font-family: monospace; font-size: 14px; font-weight: bold; color: #22c55e; }
        .use-btn { background: #059669; padding: 4px 8px; font-size: 12px; }
        .use-btn:hover { background: #047857; }
    </style>
</head>
<body>

    <h1>KaHooter</h1>

    <!-- SCANNER SECTION -->
    <div class="card">
        <h2>PIN Scanner</h2>
        <div class="row">
            <label>Start: <input type="number" id="start" value="0"></label>
            <label>End: <input type="number" id="end" value="1000000"></label>
            <label>Concurrency: <input type="number" id="conc" value="150"></label>
            <button onclick="startScan()">Scan</button>
            <button onclick="stopScan()" style="background:#4c1d95;">Stop</button>
        </div>
        <p id="scan-status" style="color:#a855f7;">idle</p>
        <p>Active sessions: <span id="hits-count" style="color:#22c55e;">0</span></p>

        <!-- Container for active sessions -->
        <div id="hits-container"></div>
    </div>

    <!-- BOT FLOOD SECTION -->
    <div class="card">
        <h2>Bot Flooder</h2>
        <div class="row">
            <label>Target Game PIN: <input type="text" id="flood-pin" placeholder="1234567"></label>
            <label>Bot Name Base: <input type="text" id="flood-name" value="Bot"></label>
            <label>Bot Count: <input type="number" id="flood-count" value="20" max="100"></label>
            <button onclick="sendFlood()">Send Bots</button>
        </div>
        <div id="log">Ready...</div>
    </div>

    <script>
        let evtSource = null;

        function startScan() {
            if (evtSource) evtSource.close();
            
            // Clear previous results container
            document.getElementById('hits-container').innerHTML = '';
            document.getElementById('hits-count').innerText = '0';

            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const conc = document.getElementById('conc').value;

            document.getElementById('scan-status').innerText = 'Scanning...';
            evtSource = new EventSource(`/scan?start=${start}&end=${end}&conc=${conc}`);

            // 1. LISTEN FOR HIT EVENT
            evtSource.addEventListener('hit', (e) => {
                const session = JSON.parse(e.data);
                addSessionToUI(session.pin);
            });

            // 2. LISTEN FOR PROGRESS EVENT
            evtSource.addEventListener('progress', (e) => {
                const data = JSON.parse(e.data);
                document.getElementById('scan-status').innerText = `Checked ${data.checked} / ${data.total}`;
                document.getElementById('hits-count').innerText = data.hits;
            });

            // 3. LISTEN FOR DONE EVENT
            evtSource.addEventListener('done', () => {
                document.getElementById('scan-status').innerText = 'Completed';
                evtSource.close();
            });
        }

        function addSessionToUI(pin) {
            const container = document.getElementById('hits-container');
            
            const div = document.createElement('div');
            div.className = 'session-item';
            div.innerHTML = `
                <span>PIN: ${pin}</span>
                <button class="use-btn" onclick="selectPin('${pin}')">Target PIN</button>
            `;
            
            container.prepend(div);
        }

        function selectPin(pin) {
            document.getElementById('flood-pin').value = pin;
            document.getElementById('flood-pin').focus();
        }

        function stopScan() {
            if (evtSource) {
                evtSource.close();
                document.getElementById('scan-status').innerText = 'Stopped';
            }
        }

        async function sendFlood() {
            const pin = document.getElementById('flood-pin').value;
            const name = document.getElementById('flood-name').value;
            const count = document.getElementById('flood-count').value;
            const log = document.getElementById('log');
        
            log.innerText = `[INFO] Sending ${count} bots to PIN ${pin}...`;
        
            try {
                const res = await fetch('/flood', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin, name, count })
                });
        
                // SAFELY CHECK IF RESPONSE IS JSON
                const contentType = res.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await res.text();
                    throw new Error(`Server returned non-JSON error (Status ${res.status}). Check server logs.`);
                }
        
                const data = await res.json();
                
                if (res.ok) {
                    log.innerText = `[SUCCESS] Joined ${data.joined}/${data.requested} bots into room ${data.pin}`;
                } else {
                    log.innerText = `[ERROR] ${data.error || 'Failed to send bots'}`;
                }
            } catch (err) {
                log.innerText = `[ERROR] ${err.message}`;
            }
        }
    </script>
</body>
</html>
